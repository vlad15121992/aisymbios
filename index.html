/* Layout: cinema — letterboxed 2.39:1 hero still, film-frame cover tiles, rust author band; guide = letterboxed cover + numbered rows with copyable prompts */
:root{
  --bg:#0D0C10;      /* space black */
  --bg-2:#17151A;
  --line:#2A262B;
  --fg:#EFE9DF;
  --muted:#8C847A;
  --rust:#993712;    /* backdrop orange */
  --yellow:#E0AE2E;  /* wordmark */
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbl{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:16px}
.mark{font:400 20px/1 var(--display);color:var(--yellow);letter-spacing:.02em}
.ig{font:500 12px/1 var(--mono);color:var(--muted)}
.ig:hover{color:var(--yellow)}

/* hero: letterboxed still */
.hero{position:relative;background:#000}
.hero .frame{position:relative;aspect-ratio:2.39/1;max-width:100%;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;animation:drift 18s ease-out both}
@keyframes drift{from{transform:scale(1.06)}to{transform:scale(1)}}
.hero .frame::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(13,12,16,.85),rgba(13,12,16,0) 55%)}
.hero .over{position:absolute;inset:auto 0 0 0;z-index:1}
.hero .over .wrap{padding-block:0 clamp(18px,3.4vw,44px);display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.hero h1{font:400 clamp(34px,6.6vw,96px)/.92 var(--display);margin:0;letter-spacing:-.02em;max-width:12ch}
.hero h1 span{color:var(--yellow)}
.hero .tc{font:500 12px/1.6 var(--mono);color:var(--fg);opacity:.75;text-align:right;white-space:nowrap}
@media (max-width:640px){.hero .frame{aspect-ratio:4/5}.hero img{object-position:62% 50%}.hero .over .wrap{flex-direction:column;align-items:flex-start}}

/* section head */
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-block:72px 24px}
.shead h2{font:400 clamp(28px,3.6vw,44px)/1 var(--display);margin:0}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 20px;padding-bottom:24px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.tile{display:block;min-width:0}
.tile .img{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--bg-2)}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1),filter .6s}
.tile:not(:hover) img,.tile:not(:hover) video{filter:saturate(.85) brightness(.92)}
.tile:hover img,.tile:hover video{transform:scale(1.045)}
.tile .info{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding-block:16px 8px;border-bottom:1px solid var(--line)}
.tile .n{font:500 12px/1 var(--mono);color:var(--yellow)}
.tile h3{font:400 clamp(20px,2.2vw,26px)/1.1 var(--display);margin:0;text-wrap:balance}
.tile .meta{font:500 11px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}
.tile:hover h3{color:var(--yellow)}

/* author band */
.band{background:var(--rust);margin-top:96px}
.band .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,72px);align-items:center;padding-block:0}
.band img{aspect-ratio:1/1;width:100%;object-fit:cover}
.band .txt{padding-block:40px}
.band .lbl{color:rgba(239,233,223,.7)}
.band p{font:400 clamp(26px,3.4vw,44px)/1.08 var(--display);margin:16px 0 28px;max-width:16ch;text-wrap:balance}
a.btn{flex:none;display:inline-flex;gap:10px;align-items:center;background:var(--yellow);color:#1A1208;font:500 13px/1 var(--mono);padding:14px 18px;white-space:nowrap}
a.btn:hover{background:var(--fg)}
@media (max-width:720px){.band .wrap{grid-template-columns:1fr;padding-top:24px}.band .txt{padding-block:0 32px}}

/* guide */
.gcover{background:#000}
.gcover .frame{position:relative;aspect-ratio:2.39/1;max-width:100%;overflow:hidden}
.gcover img{width:100%;height:100%;object-fit:cover}
.gcover .frame::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(13,12,16,.9),rgba(13,12,16,.1) 60%)}
@media (max-width:640px){.gcover .frame{aspect-ratio:4/3}}
.ghead{padding-block:28px 8px}
.ghead a{font:500 12px/1 var(--mono);color:var(--muted)}
.ghead a:hover{color:var(--fg)}
.ghead h1{font:400 clamp(36px,6vw,80px)/.95 var(--display);margin:18px 0 0;max-width:14ch;letter-spacing:-.02em}
.rows{list-style:none;margin:0;padding:32px 0 40px;counter-reset:r}
.row{counter-increment:r;display:grid;grid-template-columns:120px minmax(0,1fr);gap:24px;padding-block:36px;border-top:1px solid var(--line)}
.row::before{content:counter(r,decimal-leading-zero);font:400 40px/1 var(--display);color:var(--yellow)}
@media (max-width:640px){.row{grid-template-columns:1fr;gap:10px}.row::before{font-size:28px}}
.row > div{min-width:0}
.row h3{font:400 clamp(22px,2.6vw,30px)/1.1 var(--display);margin:0;max-width:26ch;text-wrap:balance}
.row p{margin:10px 0 0;color:var(--muted);max-width:54ch}
.prompt{position:relative;margin-top:20px;background:var(--bg-2);border-left:2px solid var(--rust)}
.prompt pre{margin:0;padding:20px 124px 20px 20px;font:400 13.5px/1.7 var(--mono);white-space:pre-wrap;word-break:break-word}
@media (max-width:640px){.prompt pre{padding:56px 16px 18px}}
.prompt .t{color:var(--yellow)}
.copy{position:absolute;top:12px;right:12px;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--fg);color:var(--bg);border:0;padding:10px 12px;cursor:pointer}
.copy:hover,.copy.ok{background:var(--yellow)}

.vhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,5vw,64px);align-items:end;padding-block:32px 8px}
.vhead .ghead{padding-block:0}
.vhead .lbl{display:block;margin-top:28px}
.vhead h1{margin-top:12px}
.steps-n{font:500 12px/1 var(--mono);color:var(--muted);margin:20px 0 0}
.vplay{display:block;height:min(72vh,640px);aspect-ratio:9/16;max-width:100%;background:#000;object-fit:cover}
@media (max-width:720px){.vhead{grid-template-columns:1fr}.vplay{height:auto;width:100%}.steps-n{display:none}}
.rowbtn{margin-top:18px}
.shot{display:block;width:100%;margin-top:20px;background:var(--bg-2)}
.shot.narrow{width:min(100%,320px)}
.whead{padding-block:32px 8px}
.whead .lbl{display:block;margin-top:28px}
.whead h1{margin-top:12px;max-width:none}
.glead{max-width:62ch;margin:18px 0 0;color:var(--muted);font-size:17px}
.vwide{display:block;width:100%;aspect-ratio:16/9;max-width:100%;margin-top:32px;background:#000}
.rlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;max-width:62ch;counter-reset:l}
.rlist li{counter-increment:l;display:grid;grid-template-columns:28px minmax(0,1fr);color:var(--fg)}
.rlist li::before{content:counter(l);font:500 12px/1.9 var(--mono);color:var(--yellow)}
.rlist .t{color:var(--yellow);font-family:var(--mono);font-size:.92em}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:28px}
</style>

/* GUIDES — "hidden": true hides a guide from the site. To add one, copy an object and edit the fields. img: cover file, pos: focal point. Refs are always @image1, @image2… */
const GUIDES=[
{"slug": "werewolf", "video": "vid/werewolf.mp4", "wide": true, "img": "img/ww-poster.jpg", "pos": "50% 50%", "tag": "Seedance 2.5", "time": "4 min", "title": "Werewolf at the pump", "lead": "A 14-second Halloween action shot in one generation: a driver fills up his pickup, a werewolf charges, one shotgun spin settles it. One character sheet and one prompt, made on Higgsfield.", "rows": [{"h": "Create the character sheet", "p": "Higgsfield Soul Cinema · 3 panels: body from the neck down, front portrait, side profile. Swap the face and outfit for your own driver.", "prompt": "Character reference sheet, 3 vertical panels side by side on a plain neutral grey studio background with a grey floor, soft even studio light, realistic photography, no text, no labels, thin white lines between the panels.\n\nAn ordinary man in his early thirties, broad-shouldered, athletic build with natural proportions; a very short buzz cut with a high skin fade at the sides, a slightly receding hairline, a short ginger-brown full beard, pale blue-grey eyes, a few freckles, light natural skin.\n\nPanel 1 — full body from the neck down, head cropped out of frame at the collar, standing relaxed with both hands in his front pockets: a red-and-black buffalo-check flannel shirt, open, sleeves rolled to the forearms, over a charcoal waffle-knit henley with three buttons; a brown leather belt with a brass buckle; a dark wristwatch on his left wrist; washed-black slim jeans; brown leather lace-up work boots.\n\nPanel 2 — front head-and-shoulders portrait: mouth closed, calm, neutral expression, eyes looking straight into the lens.\n\nPanel 3 — side profile of the head and shoulders, facing right, mouth closed, neutral expression.\n\nSame man in all three panels, same outfit. Real skin texture with pores, natural beard hair, no makeup, no beauty retouch. No hat, no glasses, no jacket, no jewellery, no logos.", "img": "img/ww-sheet.jpg", "alt": "Character sheet: driver in a buffalo-check flannel shirt"}, {"h": "Generate the video", "p": "Seedance 2.5 on Higgsfield · 14 s · 16:9 · sound on. Upload the character sheet as @image1 and paste the prompt whole. The werewolf, the shotgun and the pickup are described in words, no references needed.", "link": {"href": "https://higgsfield.ai?fpr=vladyslav-88084e", "label": "Open Higgsfield ↗"}, "prompt": "SCENE\nEXACT 2 CHARACTERS: THE DRIVER and THE WEREWOLF. Photoreal live-action, Halloween night at a lonely, lived-in old roadside gas station on a desert highway, filmed from far away by a spectator with a handheld camcorder standing on the dark shoulder across the highway. THE DRIVER is filling up his pickup while THE WEREWOLF is already sprinting at his back across the forecourt. Without turning his head, THE DRIVER reaches into the pickup's bed, pulls out a lever-action shotgun and spins it once around his hand by the lever loop — the flip-cock — then swings his upper body round and fires from the hip, point-blank, into the leaping beast. The blast bursts blood across its chest and hurls THE WEREWOLF back the way it came in an absurd, over-the-top flight: it cartwheels 18 metres through the air across the forecourt, spraying blood, and smashes through the lit glass front of the station's shop, only its legs left sticking out. THE DRIVER spins the shotgun once more to rack it, the spent shell flying, props it on his shoulder, and the pump clicks off — the tank is full. Then he hangs up the nozzle and strolls across the forecourt to the shop. When the half-dead beast lunges out of the window at him, he finishes it with a second shot from the hip, steps through the broken window, takes a strip of jerky and a bottle of soda, leaves a crumpled banknote on the ledge and walks back to his truck chewing — until a chorus of howls rises from the mountains, and he just sighs, racks the gun and keeps walking. 14 seconds, one continuous take, real time.\nTHE DRIVER — the man in @image1, exactly as shown: same face, same identity, same build, retaining the true micro-pores and skin texture. @image1 is a character sheet only (full body, front portrait, side profile on a plain grey studio background) — take only the man from it, never the grey background or the panel layout. Key identifiers to keep: a very short buzz cut with a high skin fade at the sides, a short ginger-brown full beard, pale blue-grey eyes; a red-and-black buffalo-check flannel shirt, open, sleeves rolled to the forearms, over a charcoal waffle-knit henley; a brown leather belt with a brass buckle; a dark wristwatch on his left wrist; washed-black jeans; brown leather lace-up work boots. Broad-shouldered, unhurried, hands that are very fast. Nothing added to his outfit, nothing removed — no hat, no glasses, no jacket over the flannel, no toothpick or cigarette.\nTHE SHOTGUN — one old lever-action shotgun with a large round loop on the lever, a worn wooden stock and fore-end and a dull black barrel; no markings.\nTHE WEREWOLF — a huge werewolf, about 2.2 m tall when it stands, running on all fours: coarse, matted grey-brown fur, a long wolf muzzle with bared yellow fangs, glinting yellow eyes, pointed ears flat back, a hunched, heavily muscled body, long black claws on its hands and feet, the shredded remains of jeans round its waist.\nTHE PICKUP — one battered 1980s-style American pickup truck, faded two-tone red and cream paint, rust on the wheel arches, a dented tailgate, its open bed holding a toolbox, a coil of rope and the shotgun; no badges, no lettering, no plate.\n\nRULES\nA. Frame one is already in motion: THE WEREWOLF is already sprinting on all fours across the forecourt at THE DRIVER's back, THE DRIVER is already filling up, the camera already shaking. An empty forecourt, a werewolf appearing or a slow approach = failed take.\nB. NO FLIP, NO JUMP: THE DRIVER keeps both boots on the ground the whole time. He reaches into the bed without looking, and the draw is one clean, fast, stylish move: grab by the lever loop, one full vertical spin of the shotgun around his hand in about a third of a second — the action racking as it turns — catch, swing the upper body round to the left, fire from the hip. A somersault, a backflip, a jump or a clumsy fumble = failed take.\nC. EXACTLY TWO shots in the whole take: the first point-blank, horizontal, into THE WEREWOLF's chest as it leaps; the second at the shop window, angled down into the beast as it lunges out. Each one a short, ragged muzzle flash, gone in a blink. A ball of fire or a glowing sphere at the muzzle = failed take.\nD. BLOOD: the first shot bursts dark red blood out of the werewolf's chest in a spray and a mist; blood spatters across the pickup's cream door and the concrete; as it flies and skids it leaves a red streak; red smears on the broken glass of the shop window; the second shot throws a fresh spray across the cracked glass. Real, dark, wet blood — but no dismemberment, no open wound in close-up, no organs.\nE. THE KNOCKBACK IS ABSURD: the shot hurls THE WEREWOLF backward as if hit by a speeding truck — 18 metres in a high arc, cartwheeling end over end, limbs flailing, not touching the ground until it smashes through the shop's glass front. A short shove or a fall at his feet = failed take.\nF. SIDE-ON AND FAR: a spectator's handheld camcorder from the shoulder across the highway, 35 m from the pickup; the action plays side-on across the frame. THE DRIVER turns only to his left, toward the beast, never toward the camera, and never looks into the lens — on his walk to the shop and back he stays side-on or with his back to the camera. The camcorder itself, its screen and the spectator's hands are never in frame. The camera never moves closer; it zooms, pans, shakes and flinches.\nG. Real time, one continuous take, no cuts — fast and loud for the fight, unhurried and dry for the walk. A slow-motion beat, a speed ramp or a cut = failed take.\nH. IDENTITY: THE DRIVER is the man from @image1 in every frame — same face, buzz cut, beard, flannel shirt, henley, jeans and boots; no drift to another face or outfit.\nI. THE WEREWOLF never gets back up: after the first shot it only ever lunges halfway out of the window, and after the second it goes limp for good.\n\nSPACE\nA lonely old roadside gas station on a two-lane desert highway at night, lived-in and dressed for Halloween: a flat canopy on steel posts lit by long fluorescent tubes, one of them flickering, a string of small orange lights sagging along its edge; two old pumps on a concrete island; a small cinder-block shop at the far left end of the forecourt, its wide glass front lit warm from inside, fake cobwebs in the corners of the glass, jack-o'-lanterns grinning along the window ledge; beside the shop an old ice chest humming, a wire cage of propane cylinders, a soda vending machine glowing cold with no readable text, a payphone booth with its light buzzing, an old station wagon parked against the wall; a stack of old tyres with two jack-o'-lanterns on it; oil stains, puddles and sand on the concrete; a tumbleweed rolling across in the wind; moths swarming the tubes; beyond, the dark desert, black mountains and a starry sky, a lone sodium street lamp far down the highway.\n— ANCHOR = THE PICKUP under the canopy, side-on to the highway, its nose to the right; the pump stands right behind its tail.\n— THE DRIVER stands at the pickup's rear corner on the side facing the highway, facing right toward the fuel filler; the nozzle is latched in and pumping on its own; the open bed is at his left hand.\n— THE SHOP stands 18 m to the left of THE DRIVER, its glass front facing the pumps.\n— The open forecourt between THE DRIVER and THE SHOP is empty; THE WEREWOLF comes across it from the left, at his back, and is blown back across it to the left, into THE SHOP's glass front.\n— THE DRIVER's walk: from the pickup's rear corner straight left across the forecourt to THE SHOP's broken window, and back the same way.\n— 180° AXIS: the spectator stays on the shoulder across the highway, 35 m away, for the whole shot.\n— LIGHT: the canopy's fluorescent tubes are the dominant source; the shop glows warm at the left.\n\nFIRST FRAME\nFrom across the highway, zoomed in to about 25°, the frame shaking: the canopy and the forecourt fill the middle of the frame under the cold fluorescent tubes, the orange lights sagging along the canopy edge, moths swirling. THE PICKUP stands side-on at x 62–100%, nose running out of frame to the right; THE DRIVER (@image1) stands at its rear corner at x 54–61%, side-on in profile, facing right, the fluorescent light hard on his buzz cut and the red flannel, the nozzle in the filler, his left hand resting on the edge of the open bed. THE WEREWOLF is already mid-sprint on all fours across the open forecourt at x 14–30%, about 6 m behind him, low and stretched out, claws throwing grit. The warm glow of the shop spills in from beyond the left edge of the frame; the desert night beyond is cold blue-black. A strip of dark asphalt with a faded centre line runs across the lower edge of the frame. Nobody looks into the lens.\n\nLENS & CAMERA\nLENS & CAMERA — one camera for the whole piece: 84° diagonal field of view, wide (25mm on large format). Handheld by a real operator standing inside the scene, 50–80 cm from the nearest subject, the lens at the subject's chest height or lower; with an animal, down at its eye level a few centimetres above the ground. Focus on the subject; the background soft but readable. Wide-angle outcomes: foreground presence looms larger than natural, the environment stays visible around the subject, the camera is physically close.\nCAMERA — run-and-gun handheld that is never still: the operator moves with the action on foot, a strong, chaotic, constant 4–8 cm shake with no rhythm, every step and breath in it — the frame never holds still for a single frame — a Dutch tilt swinging 3–6° from side to side, fast searching reframes that overshoot the subject and snap back half a beat late, quick small punch-ins toward the action. The camera chases anything that flies — a thrown object, a bone, a spent shell — whipping and tilting after it. The operator reacts with his body: he flinches back from a blast, ducks on a gunshot, lunges in after a hit.\nIMPACT SHAKE — on every gunshot and explosion the camera takes the hit: the frame jolts away from the blast, then two to three fast oscillations with heavy motion blur and rotational jitter, the horizon tilting 3–5°, the framing displaced 4–6% of the frame on the first jolt, decaying into loose handheld wobble within half a second.\nIN THIS SHOT: a spectator's camcorder held in shaking hands at chest height, 1.3 m above the ground, on the dark shoulder across the highway, 35 m from the pickup — far away, never closer. The camcorder has a zoom: it starts at about 25° on THE DRIVER and the charging WEREWOLF; on the gunshot it snaps out wide to about 70° and pans left after the flying beast, so the whole station — pickup, forecourt and shop — is in frame as it crashes through the glass; then it swings back and pushes in to about 20° on THE DRIVER racking the shotgun; it pans left with him at about 35° as he walks to the shop, flinches with the second shot and takes the IMPACT SHAKE again, holds at about 30° on the window while he is inside, then pans right with him at about 40° as he walks back to the pickup. The zoom lags and overshoots like a hand on a rocker, and the autofocus hunts and pumps on every change. On the gunshot the operator ducks and the camera takes the IMPACT SHAKE.\n\nACTION\n0.0–0.9s — THE WEREWOLF sprints on all fours across the forecourt at THE DRIVER's back, claws scrabbling on the concrete, a snarl rising. THE DRIVER stands at the filler, the pump running; without turning his head, he slides his left hand into the pickup's bed.\n0.9–1.5s — He pulls the lever-action shotgun out by its lever loop and spins it once around his hand in a fast vertical wheel — the action racking with a metallic clack as it turns — catches it, and swings his upper body round to the left as THE WEREWOLF launches into its leap, jaws open, claws out.\n1.5–1.8s — From the hip, point-blank, he fires: one short, ragged muzzle flash, and a burst of dark red blood sprays out of the werewolf's chest in mid-air, spattering the pickup's cream door and the concrete. The camera takes the IMPACT SHAKE.\n1.8–2.7s — THE WEREWOLF is launched back the way it came: it flies 18 metres across the whole forecourt in a high arc, cartwheeling end over end, limbs flailing, flinging blood, and smashes headfirst through the shop's lit glass front in a burst of glass, the jack-o'-lanterns on the ledge flying, the shop's lights flickering. The zoom snaps wide and pans after it.\n2.7–4.0s — The zoom swings back and pushes in on THE DRIVER: he spins the shotgun once more around his hand to rack it, the spent red shell flipping out, smoking; the pump clicks off — the tank is full. He props the shotgun on his shoulder and pulls the nozzle out. Far behind him, only THE WEREWOLF's legs stick out of the broken shop window, one foot twitching, a red smear down the glass.\n4.0–6.5s — He hangs the nozzle back on the pump with a clunk, the shotgun still propped on his shoulder, and strolls left across the forecourt toward the shop, unhurried, boots crunching on grit and scattered glass, stepping over the red streak. The tumbleweed rolls past behind him. The camcorder pans left after him.\n6.5–8.5s — He stops two metres from the broken window. The legs twitch — then THE WEREWOLF heaves itself halfway back out through the window frame with a wet snarl, jaws snapping, one clawed hand swiping at his boots. Without stepping back, he swings the shotgun down off his shoulder and fires once from the hip, angled down into it: one short muzzle flash, a fresh spray of dark blood across the cracked glass. The beast slumps back over the window frame, limp for good. The camera takes the IMPACT SHAKE.\n8.5  extra zombies or people; no grandma looking at the camera; no grey studio backgrounds from the references; no Russian or Soviet symbols; no readable labels on jars or anywhere; no CG render look, no even flat lighting; no split screen, picture-in-picture, insets or panels.\n\nPhotoreal. NO CGI. NON-IP. 16:9. 5s. SFX only. Cinematic."}, {"h": "Music", "p": "Higgsfield audio · 25 s · instrumental. Track: “The Mischief-Maker’s Midnight Waltz”.", "prompt": "Playful spooky Halloween comedy score, instrumental, cinematic. Sneaky pizzicato strings and a plodding bassoon, a twinkling celesta melody, soft eerie theremin swells, a light harpsichord, and a warm village accordion adding a folk flavour. Mischievous, tongue-in-cheek, like a dark fairy-tale comedy. Starts quiet and creeping, builds with tension and a few comic stings in the middle, then resolves into a cosy, warm, slightly silly waltz ending. Medium tempo, around 100 BPM, minor key turning to major at the end. No vocals, no drums kit, no EDM."}, {"h": "Cover 9:16", "p": "Nano Banana Pro on Higgsfield · 9:16 · 2K · 2 variants. Add the title separately in CapCut.", "list": ["@image1 — Grandma", "@image2 — Goose", "@image3 — Fat zombie", "@image4 — Backyard"], "prompt": "Photoreal live-action movie still, vertical 9:16, Halloween night. Use the grandmother from @image1 exactly (same face, beige floral headscarf, grey cardigan, beige apron over red gingham skirt, felt slippers), the grey goose from @image2 exactly, the fat zombie from @image3 exactly, and the backyard from @image4 as the location.\n\nComposition: GRANDMA stands in the centre of the frame on the wooden back porch, from the knees up, calm and unimpressed, a heavy black cast-iron frying pan resting on her shoulder, her other hand on her hip, looking just past the camera with a dry, deadpan expression. At her feet THE GOOSE stands proudly beside her, neck up. Behind her, soft in the background, in the dark garden under the apple tree with its hanging bulb, THE FAT ZOMBIE lies flat on his back in the leaves with his legs in the air, a felt slipper lying on his belly; the smashed hole in the fence behind him.\n\nLight: warm golden light from the open kitchen doorway and a jack-o'-lantern lantern on the porch as a warm rim on grandma and the goose; cold blue moonlight over the garden; deep shadows, subtle film grain, cinematic contrast, shallow depth of field with grandma tack sharp.\n\nGrandma's face sits in the middle of the frame, everything important inside the central 4:5 area; the top 20% of the frame is dark night sky and tree branches, kept clean for a title to be added later.\n\nNo text, no letters, no logos, no watermark, no grey studio backgrounds from the references, no extra people, no blood, no cartoon or CGI look."}, {"h": "Edit and finishing", "list": ["Order — Scene 1 (0–4.2 s) → Scene 2 (10 s) → Scene 3 (5 s), hard cuts.", "Picture — upscale 720p → 1080p; a light film grade (cooler shadows, warm lights, −7% saturation, +5% contrast); fine film grain; a barely visible vignette. No frames.", "Sound — the clips' own SFX up front, music underneath with auto-ducking on the hits; fade the music out at the end.", "Export — 1920×1080, 24 fps, H.264 High, AAC 320k, −14…−15 LUFS, faststart — for Instagram."]}]},

character sheet: masked driver in a black armored suit"}, {"h": "Custom noir car sheet (@image2)", "p": "The car is designed as part of the hero's gear: the same armor plates, red piping and mask-like slit lights. The fourth panel shows the interior, because half the scene happens inside the car.", "prompt": "Vehicle reference sheet, four vertical panels side by side on a plain grey studio background, no driver, no text, no letters, no logos, no emblems, no badges, no license plates. The same car in all four panels: an original custom noir hero interceptor designed as part of the same gear set as the hero's armored suit. A low, wide, muscular two-door coupe with a long hood and a short fastback rear, matte black body covered in angular segmented armor plates with chamfered edges, exactly like the segmented chest armor of a tactical suit; fine hexagonal perforated texture on the side panels and air intakes like technical suit fabric; thin red piping lines along the edges of the hood, doors and fenders. Custom features: a row of overlapping armor plates running along the center of the roof from the windshield to the rear spoiler like a mechanical spine; an exposed supercharger rising through the hood, caged in black armor bars; an integrated wedge-shaped armored ram bumper at the front; side-exit exhaust pipes just in front of the rear wheels with a faint red glow inside; the rear window covered with armored louver slats; a short armored rear spoiler; scissor doors that open upward; wide armored fenders over massive wide tires with deep tread and reinforced sidewalls; matte black wheels with armored aero disc covers. A narrow armored front face with no round headlights — instead three thin horizontal red glowing slits, like the vent slits of a half-face mask; a clear glass windshield and dark smoked side windows; a thin full-width red LED tail light bar.\nPanel 1: full side profile. Panel 2: front three-quarter view from a low angle, the red slit lights switched on. Panel 3: rear three-quarter view with the red tail light bar and the red glow of the exhausts. Panel 4: interior seen through the open scissor door — black leather bucket seats with red stitching and racing harnesses, a round flat-bottom steering wheel, a minimal dashboard with dark screens and red backlit details, a center console, an exposed black roll cage.\nSoft even studio lighting, photorealistic, sharp product-shot detail, consistent design across all four panels.", "img": "img/ta-car.jpg", "alt": "Custom noir car sheet with interior view"}, {"h": "Robot sheet (@image3)", "p": "The red light seams and the jet thrusters matter: they are what makes the robots fly with red light trails instead of jumping and falling onto the car.", "prompt": "Character reference sheet, three vertical panels side by side on a plain grey studio background, no text, no labels, no logos, no emblems. The same robot in all three panels: an original sinister humanoid security machine, unnaturally tall and gaunt, slightly hunched, with long thin limbs and elongated fingers. Armor made of worn, cracked ceramic plates in a dirty bone-white and ash-grey color, stained with soot, grime and dark oil streaks, chipped edges revealing dark metal underneath. Exposed dark gunmetal joints, pistons and bundled black cables at the neck, elbows, waist and knees, glistening with oil. A smooth faceless elongated helmet with no mouth and no features, only one thin horizontal slit glowing deep red. Thin glowing red light seams run along the edges of the armor plates — down the arms, along the sides of the torso and down the legs — and glow at every joint. Compact armored jet thrusters are built into the upper back between the shoulder blades and into the back of both calves, their nozzles glowing hot red inside.\nPanel 1: full body, front view, standing still with arms hanging down, the red light seams visible along the limbs. Panel 2: head and shoulders, front view, the red slit staring straight ahead. Panel 3: full body side profile, showing the hunched spine, the cable bundles, the back thrusters and the calf thrusters with glowing red nozzles.\nSoft even studio lighting, photorealistic, sharp detail of scratches, cracks and grime, consistent design across all three panels, not toy-like, not CGI-glossy.", "img": "img/ta-robot.jpg", "alt": "Robot reference sheet"}, {"h": "Tunnel location (@image4)", "p": "One image is enough: the whole scene happens in this tunnel. A three-quarter angle shows the wall, the road and the ceiling at once.", "prompt": "Location reference image, one single frame, no people, no vehicles, no readable signs, no readable words anywhere. A classic American urban highway tunnel at night, like the old road tunnels of New York or Boston, seen from a three-quarter angle: the camera stands low on the left lane near the wall and looks diagonally down the tunnel, so the side wall, the road and the ceiling all recede into the depth together. Two lanes of dry, dusty dark asphalt with a double solid yellow center line and white dashed lane markings, tire marks and light grime, no water. The walls are lined with old grimy cream ceramic tiles, stained and chipped, covered in layers of colorful street graffiti — abstract tags, throw-ups and murals with no readable letters or words. A narrow raised maintenance walkway along the wall with a worn steel safety railing, recessed emergency niches with small boxes. The ceiling carries large hanging jet ventilation fans, exposed steel pipes and industrial cable trays running the length of the tunnel, giving a raw loft-industrial feel. Rows of lights along the ceiling: cold white-teal fluorescent tubes mixed with warm amber sodium lamps, a single red emergency light glowing on the wall, the tunnel curving slightly and fading into haze in the distance.\nLOCKED STYLE: night, mixed lighting — cold teal-green fluorescent light, warm amber sodium accents, a single red light as the accent, dry surfaces with soft sheen on the tiles, light atmospheric haze, deep crushed blacks, gritty textures, low-key noir thriller look, anamorphic lens, shallow depth of field, photorealistic. 16:9.", "img": "img/ta-tunnel.jpg", "alt": "Empty graffiti road tunnel at night"}, {"h": "The video prompt", "p": "Seedance 2.5 · 30 seconds · 720p · 16:9 · sound on · music off. Upload the four images as references in the order above, then paste the prompt whole; the tags @image1–@image4 must match the upload order. The truck has no reference on purpose — it is described in the prompt.", "link": {"href": "https://higgsfield.ai?fpr=vladyslav-88084e", "label": "Open Higgsfield ↗"}, "prompt": "REFERENCES\n@image1 = THE DRIVER — use his face, long swept-back brown hair, matte black half-mask with red-lit vents, black armored suit with red piping and the cream \"S\" emblem on the chest; ignore the studio background and panel layout.\n@image2 = THE CAR — use its matte black armored body, red piping, three red slit headlights, caged supercharger on the hood, spine plates on the roof, side exhausts, scissor doors and the black-and-red interior with a round steering wheel; ignore the studio background.\n@image3 = THE ROBOTS — use the tall gaunt robot with cracked dirty bone-white armor plates, dark mechanical joints and cables, faceless elongated helmet with one glowing red slit, thin red light seams along the limbs, and the round jet thrusters on the shoulders, back and calves glowing red; every robot in the scene looks exactly like this; ignore the background.\n@image4 = THE TUNNEL — use the old American road tunnel with grimy cream tiles and graffiti, steel railing walkway, double yellow center line, hanging jet fans, cable trays, fluorescent and amber lights; do not copy the framing.\nTHE TRUCK (no reference): a large dark gunmetal armored box truck, riveted steel panels with rust streaks, a steel bull bar, two amber rotating beacons and red tail lights on the rear, massive rear doors; inside, two tiers of dormant robots of @image3 standing on racks in cold vapor. No text, letters, logos or emblems anywhere on the truck.\n\nVISUAL MASTER PROMPT\nPhotorealistic sci-fi action short, 30 seconds, Part 1, set entirely inside the tunnel of @image4 at night: dry dusty asphalt, grimy graffiti-covered tiles, steel railings, cable trays and hanging jet fans. Lighting comes only from practical sources: cold white-teal fluorescent tubes, warm amber sodium lamps, vehicle headlights and tail lights, the red lights of the robots, muzzle flashes and sparks. Low-key noir thriller look: deep crushed blacks, teal-and-amber palette, red only as the accent. Shot on ARRI ALEXA Mini LF with ARRI Signature Prime and Zeiss Supreme Prime lenses; wide shots 14–21mm at T2.8–T4, close-ups 32–50mm at T1.8–T2.8; 1/8 Black Pro-Mist filter for soft halation on lights and sparks while keeping blacks clean. ACES color management, Kodak Vision3 500T-style grain, subtle halation, very slight chromatic aberration. Camera language: low ground-level tracking, windshield POV, locked-off interior close-ups, lateral dolly scans, slow-motion flight at 0.25–0.5x, high-speed whip pans. Every fast move is on a car rig, dolly track, crane arm or gimbal — smooth and weighted, never handheld.\nPhysical continuity is a hard rule: the truck always drives ahead of the car, and the car stays behind and slightly to the right of it at a constant distance and speed; the truck's rear doors swing open exactly at 4.6s and stay open; the windshield progresses from spider-web cracks to a punched-through hole and never heals; the number and placement of robots on the car stay consistent from shot to shot; a destroyed robot never reappears. All robots are identical to @image3; the \"S\" emblem appears only on the driver's chest, never on the robots, truck or car.\nFlight and weight: the robots do not jump — they fly. When they launch, the jet thrusters on their back, shoulders and calves ignite with a bright red glow and propel them horizontally like missiles, bodies straight, arms reaching forward, leaving long glowing red light trails from the thrusters and the red seams. Every impact has real weight: the car's nose dips and its suspension compresses when a robot lands, the body rocks, metal dents, robot fingers dig into the bodywork and scrape across it with streams of sparks.\nAudio: realistic sound design only — tires rolling on dry asphalt, echo of the tunnel, supercharger whine, jet thruster roar, heavy metal impacts, tearing metal, shattering glass, hissing sparks, gunfire with shell casings. No music. The only voice is the male lead's English dialogue, slightly muffled by his mask, moving from bored to shocked to enraged.\n\nTIMECODED SHOT LIST\n\nACT 1 — A BAD DAY BEGINS (0.0–5.0s)\n01 (0.0–1.2s) 14mm low ground-level tracking shot: the black car of @image2 cuts through the tunnel, tucked behind and to the right of the armored truck, dust swirling off the tires.\n02 (1.2–3.6s) 40mm medium close-up in the driver's seat: the driver of @image1 grips the steering wheel, eyes narrowed above his mask, glances at the mirror, exhales through the mask and mutters, bored: \"There's no way my luck is that bad...\"\n03 (3.6–5.0s) 21mm windshield POV: the truck's rear doors loom ahead, amber beacons spinning; at exactly 4.6s the doors swing wide open, revealing two tiers of dormant robots as cold vapor pours out onto the road.\n\nACT 2 — DEATH LIGHTS UP (5.0–9.8s)\n04 (5.0–6.2s) 50mm tight close-up on his eyes above the mask: they widen, he inhales sharply and hisses: \"Holy shit...\"\n05 (6.2–7.9s) 21mm lateral dolly scan along the robot ranks inside the truck: the red slits and red seams ignite one by one in sequence and the helmets tilt up toward the car.\n06 (7.9–9.8s) 16mm slow-motion shot just outside the hold: the jet thrusters ignite red and the robots launch out of the truck, flying horizontally head-first toward the camera like missiles, arms forward, long red light trails streaming behind them through the vapor.\n\nACT 3 — UP-CLOSE AND PERSONAL (9.8–19.8s)\n07 (9.8–13.6s) 28mm roof-level shot, then intercut interior and exterior angles: the first robot slams onto the windshield — the car's nose dips, the glass bursts into spider-web cracks, he throws up an armored forearm to shield his head; more robots land on the hood, roof and sides, their fingers digging into the metal and scraping with sparks, the car rocking under their weight; glass shards rain onto his lap and he swallows hard.\n08 (13.6–16.6s) 35mm medium close-up turning into a 40mm profile: he pulls a black pistol from the center console, racks the slide, his eyes turn cold and furious, and he fires through the windshield at the robot on the hood, muzzle flashes strobing across his mask, casings flying.\n09 (16.6–17.8s) 18mm low side angle: the hit robot is knocked off the hood, its thrusters sputtering, and tumbles hard into the gap between the car and the truck, sparking along the asphalt.\n10 (17.8–19.8s) 21mm head-on into the cargo hold: two more robots fire their red thrusters and launch straight toward the camera.\n\nACT 4 — AN EYE FOR AN EYE (19.8–30.0s)\n11 (19.8–22.2s) 24mm stabilized push-in on the hood: a swarm of robots crashes down onto the car, the suspension slamming down; he keeps firing point-blank through the broken glass.\n12 (22.2–24.0s) 50mm tight close-up: he ducks under a swinging mechanical arm and shouts: \"Get off my car!\"\n13 (24.0–28.5s) 40mm interior close-up into a 50mm extreme close-up: a mechanical arm punches through the windshield and clamps its hand over his masked face, pinning his head against the seat, the mask scraping; he jams the pistol into the arm's elbow joint and snarls: \"Let... GO of my face—!\"\n14 (28.5–30.0s) 28mm rapid whip pan from interior to exterior: he fires into the joint, the arm shatters in a burst of sparks, and the car rockets forward beneath the tunnel lights. End of Part 1.\n\nNEGATIVE PROMPT\nFisheye, handheld shake, camera sway, home-video look, rolling shutter, warping, ghosting, excessive lens flare, strong chromatic aberration. Water, puddles, flooding, rain. Flat fill light, softbox look, fog filling the frame, blown highlights, HDR bloom. Cartoon, cel-shading, game CG, toy-like robots. Subtitles, watermarks, logos, text on the truck or robots, title or end cards, text overlays. Characters looking at the camera. Any music or score. Face swap, facial drift, mask changing shape or color, hair or suit changing, the \"S\" emblem appearing anywhere except the driver's chest, car design changing. Robots that differ from @image3, robots jumping or falling instead of flying, weightless landings, robots in black armor. Truck behind the car, inconsistent truck door state, self-healing cracks, robots reappearing after being destroyed. Extra or missing fingers, backward joints, clipping through the car, floating objects, firing without a gun, missing muzzle flash, missing recoil, missing shell casings. Excessive motion blur, low resolution."}, {"h": "What makes it work", "p": "Five rules from the test runs; each one fixed a real failure.", "list": ["Give every important object its own sheet. With only the hero and the car as references, the model painted the hero's suit and emblem onto the robots and the truck.", "Keep the hero's colors off everyone else. Black with red piping belongs to the hero; the robots are bone-white so the model never mixes them up.", "Write the physics into the prompt. Robots without thrusters and the line \"they fly, not jump\" fall onto the car like puppets. Suspension, dents and sparks make every hit feel heavy.", "No text on vehicles or robots. Generated lettering always comes out misspelled; add titles and subtitles in the edit.", "Expect to edit. Even a good take has a slow beat or a glitchy frame. Speed up the hover, cut the flash, and the scene drops from 30 to about 27 seconds of pure action."]}]},

HARD CUT TO

function guide(g){

  </div>`;
  app.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{
    const t=g.rows[b.dataset.i].prompt,pre=b.nextElementSibling;
    const ok=()=>{b.textContent='Copied';b.classList.add('ok');setTimeout(()=>{b.textContent='Copy';b.classList.remove('ok')},1500)};
