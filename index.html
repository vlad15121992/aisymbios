<style>
/* Layout: cinema — letterboxed 2.39:1 hero still, film-frame cover tiles, rust author band; guide = letterboxed cover + numbered rows with copyable prompts */
:root{
  --bg:#0D0C10;      /* space black */
  --bg-2:#17151A;
  --line:#2A262B;
  --fg:#EFE9DF;
  --muted:#8C847A;
  --rust:#993712;    /* backdrop orange */
  --yellow:#E0AE2E;  /* wordmark */
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbl{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:16px}
.mark{font:400 20px/1 var(--display);color:var(--yellow);letter-spacing:.02em}
.ig{font:500 12px/1 var(--mono);color:var(--muted)}
.ig:hover{color:var(--yellow)}

/* hero: letterboxed still */
.hero{position:relative;background:#000}
.hero .frame{position:relative;aspect-ratio:2.39/1;max-width:100%;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;animation:drift 18s ease-out both}
@keyframes drift{from{transform:scale(1.06)}to{transform:scale(1)}}
.hero .frame::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(13,12,16,.85),rgba(13,12,16,0) 55%)}
.hero .over{position:absolute;inset:auto 0 0 0;z-index:1}
.hero .over .wrap{padding-block:0 clamp(18px,3.4vw,44px);display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.hero h1{font:400 clamp(34px,6.6vw,96px)/.92 var(--display);margin:0;letter-spacing:-.02em;max-width:12ch}
.hero h1 span{color:var(--yellow)}
.hero .tc{font:500 12px/1.6 var(--mono);color:var(--fg);opacity:.75;text-align:right;white-space:nowrap}
@media (max-width:640px){.hero .frame{aspect-ratio:4/5}.hero img{object-position:62% 50%}.hero .over .wrap{flex-direction:column;align-items:flex-start}}

/* section head */
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-block:72px 24px}
.shead h2{font:400 clamp(28px,3.6vw,44px)/1 var(--display);margin:0}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 20px;padding-bottom:24px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.tile{display:block;min-width:0}
.tile .img{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--bg-2)}
.tile img,.tile video{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1),filter .6s}
.tile:not(:hover) img,.tile:not(:hover) video{filter:saturate(.85) brightness(.92)}
.tile:hover img,.tile:hover video{transform:scale(1.045)}
.tile .info{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding-block:16px 8px;border-bottom:1px solid var(--line)}
.tile .n{font:500 12px/1 var(--mono);color:var(--yellow)}
.tile h3{font:400 clamp(20px,2.2vw,26px)/1.1 var(--display);margin:0;text-wrap:balance}
.tile .meta{font:500 11px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.12em;white-space:nowrap}
.tile:hover h3{color:var(--yellow)}

/* author band */
.band{background:var(--rust);margin-top:96px}
.band .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,5vw,72px);align-items:center;padding-block:0}
.band img{aspect-ratio:1/1;width:100%;object-fit:cover}
.band .txt{padding-block:40px}
.band .lbl{color:rgba(239,233,223,.7)}
.band p{font:400 clamp(26px,3.4vw,44px)/1.08 var(--display);margin:16px 0 28px;max-width:16ch;text-wrap:balance}
a.btn{flex:none;display:inline-flex;gap:10px;align-items:center;background:var(--yellow);color:#1A1208;font:500 13px/1 var(--mono);padding:14px 18px;white-space:nowrap}
a.btn:hover{background:var(--fg)}
@media (max-width:720px){.band .wrap{grid-template-columns:1fr;padding-top:24px}.band .txt{padding-block:0 32px}}

/* guide */
.gcover{background:#000}
.gcover .frame{position:relative;aspect-ratio:2.39/1;max-width:100%;overflow:hidden}
.gcover img{width:100%;height:100%;object-fit:cover}
.gcover .frame::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(13,12,16,.9),rgba(13,12,16,.1) 60%)}
@media (max-width:640px){.gcover .frame{aspect-ratio:4/3}}
.ghead{padding-block:28px 8px}
.ghead a{font:500 12px/1 var(--mono);color:var(--muted)}
.ghead a:hover{color:var(--fg)}
.ghead h1{font:400 clamp(36px,6vw,80px)/.95 var(--display);margin:18px 0 0;max-width:14ch;letter-spacing:-.02em}
.rows{list-style:none;margin:0;padding:32px 0 40px;counter-reset:r}
.row{counter-increment:r;display:grid;grid-template-columns:120px minmax(0,1fr);gap:24px;padding-block:36px;border-top:1px solid var(--line)}
.row::before{content:counter(r,decimal-leading-zero);font:400 40px/1 var(--display);color:var(--yellow)}
@media (max-width:640px){.row{grid-template-columns:1fr;gap:10px}.row::before{font-size:28px}}
.row > div{min-width:0}
.row h3{font:400 clamp(22px,2.6vw,30px)/1.1 var(--display);margin:0;max-width:26ch;text-wrap:balance}
.row p{margin:10px 0 0;color:var(--muted);max-width:54ch}
.prompt{position:relative;margin-top:20px;background:var(--bg-2);border-left:2px solid var(--rust)}
.prompt pre{margin:0;padding:20px 124px 20px 20px;font:400 13.5px/1.7 var(--mono);white-space:pre-wrap;word-break:break-word}
@media (max-width:640px){.prompt pre{padding:56px 16px 18px}}
.prompt .t{color:var(--yellow)}
.copy{position:absolute;top:12px;right:12px;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--fg);color:var(--bg);border:0;padding:10px 12px;cursor:pointer}
.copy:hover,.copy.ok{background:var(--yellow)}

.vhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,5vw,64px);align-items:end;padding-block:32px 8px}
.vhead .ghead{padding-block:0}
.vhead .lbl{display:block;margin-top:28px}
.vhead h1{margin-top:12px}
.steps-n{font:500 12px/1 var(--mono);color:var(--muted);margin:20px 0 0}
.vplay{display:block;height:min(72vh,640px);aspect-ratio:9/16;max-width:100%;background:#000;object-fit:cover}
@media (max-width:720px){.vhead{grid-template-columns:1fr}.vplay{height:auto;width:100%}.steps-n{display:none}}
.rowbtn{margin-top:18px}
.shot{display:block;width:100%;margin-top:20px;background:var(--bg-2)}
.shot.narrow{width:min(100%,320px)}
.whead{padding-block:32px 8px}
.whead .lbl{display:block;margin-top:28px}
.whead h1{margin-top:12px;max-width:none}
.glead{max-width:62ch;margin:18px 0 0;color:var(--muted);font-size:17px}
.vwide{display:block;width:100%;aspect-ratio:16/9;max-width:100%;margin-top:32px;background:#000}
.rlist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px;max-width:62ch;counter-reset:l}
.rlist li{counter-increment:l;display:grid;grid-template-columns:28px minmax(0,1fr);color:var(--fg)}
.rlist li::before{content:counter(l);font:500 12px/1.9 var(--mono);color:var(--yellow)}
.rlist .t{color:var(--yellow);font-family:var(--mono);font-size:.92em}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:28px}
</style>
</head>

const GUIDES=[
{"slug": "tunnel-ambush", "video": "vid/tunnel-ambush.mp4", "img": "img/ta-poster.jpg", "pos": "50% 50%", "wide": true, "tag": "Seedance 2.5", "time": "8 min", "title": "Tunnel ambush", "lead": "A 30-second photoreal action scene made in one generation: a masked driver, a custom noir car, and a swarm of jet-powered robots ambushing him in a graffiti tunnel. Build four reference sheets, then run one prompt on Seedance 2.5.", "rows": [{"h": "What you need", "p": "Four reference images and one video generation. Make every sheet on a plain grey studio background so the video model copies the design, not the backdrop.", "list": ["@image1 — Hero character sheet (masked driver) · Step 1", "@image2 — Custom noir car sheet · Step 2", "@image3 — Robot sheet · Step 3", "@image4 — Tunnel location · Step 4"]}, {"h": "Hero character sheet (@image1)", "p": "A masked driver in a black armored suit. Swap the face, hair and emblem for your own character.", "prompt": "Character reference sheet, four vertical panels side by side on a plain dark grey studio background, no text, no labels, no logos. The same man in all panels: mid-thirties, shoulder-length wavy brown hair swept back, grey-blue eyes, light stubble; a matte black armored half-mask covering his nose, mouth and jaw, with vertical vents and thin red-lit side slits; a black textured tactical suit with segmented matte black armor plates on the chest, shoulders, forearms and shins, thin red piping lines along the limbs, a cream angular \"S\" emblem crossed by a red diagonal slash on the chest, a wide grey belt, armored black boots and gloves.\nPanel 1: head and shoulders, front view, staring into the lens. Panel 2: head and shoulders, side profile. Panel 3: full suit, front view, from the neck down. Panel 4: full suit, back view, from the neck down.\nSoft even studio lighting, photorealistic, sharp detail of skin, mask and suit fabric, consistent design across all panels.", "img": "img/ta-hero.jpg", "alt": "Hero character sheet: masked driver in a black armored suit"}, {"h": "Custom noir car sheet (@image2)", "p": "The car is designed as part of the hero's gear: the same armor plates, red piping and mask-like slit lights. The fourth panel shows the interior, because half the scene happens inside the car.", "prompt": "Vehicle reference sheet, four vertical panels side by side on a plain grey studio background, no driver, no text, no letters, no logos, no emblems, no badges, no license plates. The same car in all four panels: an original custom noir hero interceptor designed as part of the same gear set as the hero's armored suit. A low, wide, muscular two-door coupe with a long hood and a short fastback rear, matte black body covered in angular segmented armor plates with chamfered edges, exactly like the segmented chest armor of a tactical suit; fine hexagonal perforated texture on the side panels and air intakes like technical suit fabric; thin red piping lines along the edges of the hood, doors and fenders. Custom features: a row of overlapping armor plates running along the center of the roof from the windshield to the rear spoiler like a mechanical spine; an exposed supercharger rising through the hood, caged in black armor bars; an integrated wedge-shaped armored ram bumper at the front; side-exit exhaust pipes just in front of the rear wheels with a faint red glow inside; the rear window covered with armored louver slats; a short armored rear spoiler; scissor doors that open upward; wide armored fenders over massive wide tires with deep tread and reinforced sidewalls; matte black wheels with armored aero disc covers. A narrow armored front face with no round headlights — instead three thin horizontal red glowing slits, like the vent slits of a half-face mask; a clear glass windshield and dark smoked side windows; a thin full-width red LED tail light bar.\nPanel 1: full side profile. Panel 2: front three-quarter view from a low angle, the red slit lights switched on. Panel 3: rear three-quarter view with the red tail light bar and the red glow of the exhausts. Panel 4: interior seen through the open scissor door — black leather bucket seats with red stitching and racing harnesses, a round flat-bottom steering wheel, a minimal dashboard with dark screens and red backlit details, a center console, an exposed black roll cage.\nSoft even studio lighting, photorealistic, sharp product-shot detail, consistent design across all four panels.", "img": "img/ta-car.jpg", "alt": "Custom noir car sheet with interior view"}, {"h": "Robot sheet (@image3)", "p": "The red light seams and the jet thrusters matter: they are what makes the robots fly with red light trails instead of jumping and falling onto the car.", "prompt": "Character reference sheet, three vertical panels side by side on a plain grey studio background, no text, no labels, no logos, no emblems. The same robot in all three panels: an original sinister humanoid security machine, unnaturally tall and gaunt, slightly hunched, with long thin limbs and elongated fingers. Armor made of worn, cracked ceramic plates in a dirty bone-white and ash-grey color, stained with soot, grime and dark oil streaks, chipped edges revealing dark metal underneath. Exposed dark gunmetal joints, pistons and bundled black cables at the neck, elbows, waist and knees, glistening with oil. A smooth faceless elongated helmet with no mouth and no features, only one thin horizontal slit glowing deep red. Thin glowing red light seams run along the edges of the armor plates — down the arms, along the sides of the torso and down the legs — and glow at every joint. Compact armored jet thrusters are built into the upper back between the shoulder blades and into the back of both calves, their nozzles glowing hot red inside.\nPanel 1: full body, front view, standing still with arms hanging down, the red light seams visible along the limbs. Panel 2: head and shoulders, front view, the red slit staring straight ahead. Panel 3: full body side profile, showing the hunched spine, the cable bundles, the back thrusters and the calf thrusters with glowing red nozzles.\nSoft even studio lighting, photorealistic, sharp detail of scratches, cracks and grime, consistent design across all three panels, not toy-like, not CGI-glossy.", "img": "img/ta-robot.jpg", "alt": "Robot reference sheet"}, {"h": "Tunnel location (@image4)", "p": "One image is enough: the whole scene happens in this tunnel. A three-quarter angle shows the wall, the road and the ceiling at once.", "prompt": "Location reference image, one single frame, no people, no vehicles, no readable signs, no readable words anywhere. A classic American urban highway tunnel at night, like the old road tunnels of New York or Boston, seen from a three-quarter angle: the camera stands low on the left lane near the wall and looks diagonally down the tunnel, so the side wall, the road and the ceiling all recede into the depth together. Two lanes of dry, dusty dark asphalt with a double solid yellow center line and white dashed lane markings, tire marks and light grime, no water. The walls are lined with old grimy cream ceramic tiles, stained and chipped, covered in layers of colorful street graffiti — abstract tags, throw-ups and murals with no readable letters or words. A narrow raised maintenance walkway along the wall with a worn steel safety railing, recessed emergency niches with small boxes. The ceiling carries large hanging jet ventilation fans, exposed steel pipes and industrial cable trays running the length of the tunnel, giving a raw loft-industrial feel. Rows of lights along the ceiling: cold white-teal fluorescent tubes mixed with warm amber sodium lamps, a single red emergency light glowing on the wall, the tunnel curving slightly and fading into haze in the distance.\nLOCKED STYLE: night, mixed lighting — cold teal-green fluorescent light, warm amber sodium accents, a single red light as the accent, dry surfaces with soft sheen on the tiles, light atmospheric haze, deep crushed blacks, gritty textures, low-key noir thriller look, anamorphic lens, shallow depth of field, photorealistic. 16:9.", "img": "img/ta-tunnel.jpg", "alt": "Empty graffiti road tunnel at night"}, {"h": "The video prompt", "p": "Seedance 2.5 · 30 seconds · 720p · 16:9 · sound on · music off. Upload the four images as references in the order above, then paste the prompt whole; the tags @image1–@image4 must match the upload order. The truck has no reference on purpose — it is described in the prompt.", "link": {"href": "https://higgsfield.ai?fpr=vladyslav-88084e", "label": "Open Higgsfield ↗"}, "prompt": "REFERENCES\n@image1 = THE DRIVER — use his face, long swept-back brown hair, matte black half-mask with red-lit vents, black armored suit with red piping and the cream \"S\" emblem on the chest; ignore the studio background and panel layout.\n@image2 = THE CAR — use its matte black armored body, red piping, three red slit headlights, caged supercharger on the hood, spine plates on the roof, side exhausts, scissor doors and the black-and-red interior with a round steering wheel; ignore the studio background.\n@image3 = THE ROBOTS — use the tall gaunt robot with cracked dirty bone-white armor plates, dark mechanical joints and cables, faceless elongated helmet with one glowing red slit, thin red light seams along the limbs, and the round jet thrusters on the shoulders, back and calves glowing red; every robot in the scene looks exactly like this; ignore the background.\n@image4 = THE TUNNEL — use the old American road tunnel with grimy cream tiles and graffiti, steel railing walkway, double yellow center line, hanging jet fans, cable trays, fluorescent and amber lights; do not copy the framing.\nTHE TRUCK (no reference): a large dark gunmetal armored box truck, riveted steel panels with rust streaks, a steel bull bar, two amber rotating beacons and red tail lights on the rear, massive rear doors; inside, two tiers of dormant robots of @image3 standing on racks in cold vapor. No text, letters, logos or emblems anywhere on the truck.\n\nVISUAL MASTER PROMPT\nPhotorealistic sci-fi action short, 30 seconds, Part 1, set entirely inside the tunnel of @image4 at night: dry dusty asphalt, grimy graffiti-covered tiles, steel railings, cable trays and hanging jet fans. Lighting comes only from practical sources: cold white-teal fluorescent tubes, warm amber sodium lamps, vehicle headlights and tail lights, the red lights of the robots, muzzle flashes and sparks. Low-key noir thriller look: deep crushed blacks, teal-and-amber palette, red only as the accent. Shot on ARRI ALEXA Mini LF with ARRI Signature Prime and Zeiss Supreme Prime lenses; wide shots 14–21mm at T2.8–T4, close-ups 32–50mm at T1.8–T2.8; 1/8 Black Pro-Mist filter for soft halation on lights and sparks while keeping blacks clean. ACES color management, Kodak Vision3 500T-style grain, subtle halation, very slight chromatic aberration. Camera language: low ground-level tracking, windshield POV, locked-off interior close-ups, lateral dolly scans, slow-motion flight at 0.25–0.5x, high-speed whip pans. Every fast move is on a car rig, dolly track, crane arm or gimbal — smooth and weighted, never handheld.\nPhysical continuity is a hard rule: the truck always drives ahead of the car, and the car stays behind and slightly to the right of it at a constant distance and speed; the truck's rear doors swing open exactly at 4.6s and stay open; the windshield progresses from spider-web cracks to a punched-through hole and never heals; the number and placement of robots on the car stay consistent from shot to shot; a destroyed robot never reappears. All robots are identical to @image3; the \"S\" emblem appears only on the driver's chest, never on the robots, truck or car.\nFlight and weight: the robots do not jump — they fly. When they launch, the jet thrusters on their back, shoulders and calves ignite with a bright red glow and propel them horizontally like missiles, bodies straight, arms reaching forward, leaving long glowing red light trails from the thrusters and the red seams. Every impact has real weight: the car's nose dips and its suspension compresses when a robot lands, the body rocks, metal dents, robot fingers dig into the bodywork and scrape across it with streams of sparks.\nAudio: realistic sound design only — tires rolling on dry asphalt, echo of the tunnel, supercharger whine, jet thruster roar, heavy metal impacts, tearing metal, shattering glass, hissing sparks, gunfire with shell casings. No music. The only voice is the male lead's English dialogue, slightly muffled by his mask, moving from bored to shocked to enraged.\n\nTIMECODED SHOT LIST\n\nACT 1 — A BAD DAY BEGINS (0.0–5.0s)\n01 (0.0–1.2s) 14mm low ground-level tracking shot: the black car of @image2 cuts through the tunnel, tucked behind and to the right of the armored truck, dust swirling off the tires.\n02 (1.2–3.6s) 40mm medium close-up in the driver's seat: the driver of @image1 grips the steering wheel, eyes narrowed above his mask, glances at the mirror, exhales through the mask and mutters, bored: \"There's no way my luck is that bad...\"\n03 (3.6–5.0s) 21mm windshield POV: the truck's rear doors loom ahead, amber beacons spinning; at exactly 4.6s the doors swing wide open, revealing two tiers of dormant robots as cold vapor pours out onto the road.\n\nACT 2 — DEATH LIGHTS UP (5.0–9.8s)\n04 (5.0–6.2s) 50mm tight close-up on his eyes above the mask: they widen, he inhales sharply and hisses: \"Holy shit...\"\n05 (6.2–7.9s) 21mm lateral dolly scan along the robot ranks inside the truck: the red slits and red seams ignite one by one in sequence and the helmets tilt up toward the car.\n06 (7.9–9.8s) 16mm slow-motion shot just outside the hold: the jet thrusters ignite red and the robots launch out of the truck, flying horizontally head-first toward the camera like missiles, arms forward, long red light trails streaming behind them through the vapor.\n\nACT 3 — UP-CLOSE AND PERSONAL (9.8–19.8s)\n07 (9.8–13.6s) 28mm roof-level shot, then intercut interior and exterior angles: the first robot slams onto the windshield — the car's nose dips, the glass bursts into spider-web cracks, he throws up an armored forearm to shield his head; more robots land on the hood, roof and sides, their fingers digging into the metal and scraping with sparks, the car rocking under their weight; glass shards rain onto his lap and he swallows hard.\n08 (13.6–16.6s) 35mm medium close-up turning into a 40mm profile: he pulls a black pistol from the center console, racks the slide, his eyes turn cold and furious, and he fires through the windshield at the robot on the hood, muzzle flashes strobing across his mask, casings flying.\n09 (16.6–17.8s) 18mm low side angle: the hit robot is knocked off the hood, its thrusters sputtering, and tumbles hard into the gap between the car and the truck, sparking along the asphalt.\n10 (17.8–19.8s) 21mm head-on into the cargo hold: two more robots fire their red thrusters and launch straight toward the camera.\n\nACT 4 — AN EYE FOR AN EYE (19.8–30.0s)\n11 (19.8–22.2s) 24mm stabilized push-in on the hood: a swarm of robots crashes down onto the car, the suspension slamming down; he keeps firing point-blank through the broken glass.\n12 (22.2–24.0s) 50mm tight close-up: he ducks under a swinging mechanical arm and shouts: \"Get off my car!\"\n13 (24.0–28.5s) 40mm interior close-up into a 50mm extreme close-up: a mechanical arm punches through the windshield and clamps its hand over his masked face, pinning his head against the seat, the mask scraping; he jams the pistol into the arm's elbow joint and snarls: \"Let... GO of my face—!\"\n14 (28.5–30.0s) 28mm rapid whip pan from interior to exterior: he fires into the joint, the arm shatters in a burst of sparks, and the car rockets forward beneath the tunnel lights. End of Part 1.\n\nNEGATIVE PROMPT\nFisheye, handheld shake, camera sway, home-vide const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tile=(g,i)=>`<a class="tile" href="#${g.slug}"><div class="img">${g.video?`<video src="${g.video}" poster="${g.img}" muted loop playsinline autoplay preload="metadata" style="object-position:${g.pos}"></video>`:`<img src="${g.img}" alt="" loading="lazy" style="object-position:${g.pos}">`}</div><div class="info"><span class="n">${String(i+1).padStart(2,'0')}</span><h3>${esc(g.title)}</h3><span class="meta">${esc(g.tag)} · ${esc(g.time)}</span></div></a>`;

function home(){
  app.innerHTML=`
  <section class="hero" id="top"><div class="frame"><img src="img/hero.jpg" alt="A man on a red chair watches a meteor fall toward Earth"></div>
    <div class="over"><div class="wrap"><h1>AI STUDIO <span>SYMBIOS</span></h1><a class="btn" href="https://instagram.com/aisymbios" target="_blank" rel="noopener">Instagram ↗</a></div></div></section>
  <div class="wrap">
    <div class="shead"><h2>Guides</h2><span class="lbl">${GUIDES.length?GUIDES.length+(GUIDES.length>1?' guides':' guide'):'First one coming soon'}</span></div>
    ${GUIDES.length?`<div class="grid">${GUIDES.map(tile).join('')}</div>`:''}
  </div>
  <section class="band"><div class="wrap">
    <img src="img/portrait.jpg" alt="SYMBIOS founder" loading="lazy">
    <div class="txt"><p>Cinematic AI films</p><a class="btn" href="https://instagram.com/aisymbios" target="_blank" rel="noopener">Instagram ↗</a></div>
  </div></section>`;
}
function guide(g){
  app.innerHTML=`
  ${g.wide?`<div class="wrap whead"><div class="ghead"><a href="#top">← Guides</a><span class="lbl">${esc(g.tag)} · ${esc(g.time)}</span><h1>${esc(g.title)}</h1>${g.lead?`<p class="glead">${esc(g.lead)}</p>`:''}</div><video class="vwide" src="${g.video}" poster="${g.img}" controls playsinline preload="metadata"></video></div>`:g.video?`<div class="wrap vhead"><div class="ghead"><a href="#top">← Guides</a><span class="lbl">${esc(g.tag)} · ${esc(g.time)}</span><h1>${esc(g.title)}</h1><p class="steps-n">${g.rows.length} steps · result on the right</p></div><video class="vplay" src="${g.video}" poster="${g.img}" controls playsinline preload="metadata"></video></div>`:`<section class="gcover"><div class="frame"><img src="${g.img}" alt="" style="object-position:${g.pos}"></div></section>`}
  <div class="wrap">
    ${g.video?'':`<div class="ghead"><a href="#top">← Guides</a><h1>${esc(g.title)}</h1></div>`}
    <ol class="rows">${g.rows.map((r,i)=>`<li class="row"><div><h3>${esc(r.h)}</h3>${r.p?`<p>${esc(r.p)}</p>`:''}${r.list?`<ul class="rlist">${r.list.map(x=>`<li><span>${esc(x).replace(/@image\d/g,m=>`<span class="t">${m}</span>`)}</span></li>`).join('')}</ul>`:''}${r.link?`<a class="btn rowbtn" href="${r.link.href}" target="_blank" rel="noopener">${esc(r.link.label)}</a>`:''}${r.img?`<img class="shot${r.narrow?' narrow':''}" src="${r.img}" alt="${esc(r.alt||'')}" loading="lazy">`:''}${r.prompt?`<div class="prompt"><button class="copy" id="cp${i}" data-i="${i}">Copy</button><pre>${esc(r.prompt).replace(/@im(?:g|age)\d/gi,m=>`<span class="t">${m}</span>`)}</pre></div>`:''}</div></li>`).join('')}</ol>
    ${GUIDES.length>1?`<div class="shead"><h2>More guides</h2></div>
    <div class="grid">${GUIDES.filter(o=>o!==g).slice(0,2).map(o=>tile(o,GUIDES.indexOf(o))).join('')}</div>`:''}
  </div>`;
  app.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{
    const t=g.rows[b.dataset.i].prompt,pre=b.nextElementSibling;
    const ok=()=>{b.textContent='Copied';b.classList.add('ok');setTimeout(()=>{b.textContent='Copy';b.classList.remove('ok')},1500)};
    const sel=()=>{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Ctrl+C'};
    try{navigator.clipboard.writeText(t).then(ok,sel)}catch(e){sel()}
  });
  scrollTo(0,0);
}
function route(){const g=GUIDES.find(x=>x.slug===location.hash.slice(1));g?guide(g):home()}
addEventListener('hashchange',route);route();
</script>
